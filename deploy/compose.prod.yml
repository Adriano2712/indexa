# Produção numa VM única (ADR-0013): API + Postgres + Caddy (HTTPS automático via Let's Encrypt).
# Uso na VM: cp .env.example .env  (preencher)  &&  docker compose -f deploy/compose.prod.yml --env-file .env up -d --build
services:
  api:
    build: ..
    restart: unless-stopped
    environment:
      ConnectionStrings__Indexa: "Host=postgres;Database=indexa;Username=indexa;Password=${POSTGRES_PASSWORD}"
      Jwt__Chave: ${JWT_CHAVE}
      Auth__PermitirRegistro: ${PERMITIR_REGISTRO:-false}
      Banco__AplicarMigracoesAoIniciar: "true"
      Hangfire__Painel: "false"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Porta: ${SMTP_PORTA:-587}
      Smtp__Usuario: ${SMTP_USUARIO}
      Smtp__Senha: ${SMTP_SENHA}
      Smtp__Remetente: ${SMTP_REMETENTE}
      Smtp__Seguranca: StartTls
    volumes:
      - documentos:/app/armazenamento
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: indexa
      POSTGRES_USER: indexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexa -d indexa"]
      interval: 10s
      retries: 10

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - api

volumes:
  pg:
  documentos:
  caddy:
