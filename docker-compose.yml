services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: indexa
      POSTGRES_USER: indexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexa_dev}
    ports:
      - "${INDEXA_PG_PORTA:-5433}:5432"
    volumes:
      - indexa-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexa -d indexa"]
      interval: 5s
      retries: 10

  # SMTP falso para desenvolvimento: tudo que a API envia aparece em http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${INDEXA_SMTP_PORTA:-1026}:1025"
      - "${INDEXA_MAILPIT_UI:-8026}:8025"

volumes:
  indexa-pg:
